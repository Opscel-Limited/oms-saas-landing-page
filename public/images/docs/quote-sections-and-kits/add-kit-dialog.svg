<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="aktitle akdesc">
<title id="aktitle">The Add a kit dialog</title>
<desc id="akdesc">Dialog titled Add a kit. Kit chosen: Fire alarm zone. Add it as: New sections is selected, with a counter set to 3 areas and a heading for each (Ground floor, First floor, Second floor). Below, a list of kit lines each with a tick box, one line unticked to leave it out. The button reads Add 3 sections.</desc>
<style>
.lbl{font-family:Manrope,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
.title{font-size:14px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.field{fill:#F6F8FA;stroke:#CBD2DA;stroke-width:1;}
.acc{fill:#E4EFF7;stroke:#026A9F;stroke-width:1.5;}
.btn{fill:#026A9F;}
.btnt{font-size:12px;font-weight:600;fill:#FFFFFF;}
</style>
<rect x="1" y="1" width="558" height="428" rx="8" class="box"/>
<text x="24" y="34" class="lbl title" style="font-size:16px">Add a kit</text>
<rect x="24" y="48" width="512" height="30" rx="4" class="field"/><text x="34" y="68" class="lbl body">Fire alarm zone</text>
<text x="24" y="102" class="lbl body" style="font-weight:600">Add it as</text>
<rect x="24" y="110" width="250" height="48" rx="4" class="acc"/><circle cx="42" cy="134" r="6" fill="#026A9F"/><text x="56" y="130" class="lbl body" style="font-weight:600">New sections</text><text x="56" y="148" class="lbl note">One per area of the building</text>
<rect x="286" y="110" width="250" height="48" rx="4" class="box"/><circle cx="304" cy="134" r="6" fill="none" stroke="#586070"/><text x="318" y="130" class="lbl body" style="font-weight:600">Into an existing section</text><text x="318" y="148" class="lbl note">Mix lines under one heading</text>
<text x="24" y="188" class="lbl body">How many areas?</text>
<rect x="150" y="172" width="28" height="24" rx="4" class="box"/><text x="159" y="189" class="lbl body">-</text><text x="190" y="189" class="lbl body" style="font-weight:600">3</text><rect x="208" y="172" width="28" height="24" rx="4" class="box"/><text x="216" y="189" class="lbl body">+</text>
<rect x="24" y="206" width="160" height="26" rx="4" class="field"/><text x="32" y="223" class="lbl body">Ground floor</text>
<rect x="194" y="206" width="160" height="26" rx="4" class="field"/><text x="202" y="223" class="lbl body">First floor</text>
<rect x="364" y="206" width="160" height="26" rx="4" class="field"/><text x="372" y="223" class="lbl body">Second floor</text>
<text x="24" y="262" class="lbl body" style="font-weight:600">Lines</text><text x="140" y="262" class="lbl note">Untick to leave a line out</text>
<line x1="24" y1="272" x2="536" y2="272" stroke="#E1E5EA"/>
<rect x="24" y="284" width="14" height="14" rx="3" class="btn"/><text x="50" y="296" class="lbl body">Addressable smoke detector</text><text x="470" y="296" class="lbl body">x 6</text>
<rect x="24" y="312" width="14" height="14" rx="3" class="btn"/><text x="50" y="324" class="lbl body">Manual call point</text><text x="470" y="324" class="lbl body">x 2</text>
<rect x="24" y="340" width="14" height="14" rx="3" class="field"/><text x="50" y="352" class="lbl body" style="fill:#586070">Sounder beacon (left out)</text><text x="470" y="352" class="lbl note">x 2</text>
<rect x="24" y="372" width="512" height="1" fill="#E1E5EA"/>
<rect x="340" y="384" width="90" height="30" rx="4" class="box"/><text x="368" y="404" class="lbl body">Cancel</text>
<rect x="440" y="384" width="96" height="30" rx="4" class="btn"/><text x="450" y="404" class="lbl btnt">Add 3 sections</text>
</svg>
