<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="cqtitle cqdesc">
<title id="cqtitle">How a sectioned quote looks to the customer</title>
<desc id="cqdesc">Sample quote page. A Summary of works table lists 1 Ground floor 422.00, 2 First floor 524.00. Section 1, Ground floor, has a description and numbered lines 1.1, 1.2 and 1.3 with prices, and a subtotal. Section 2, First floor, is set to Lines, no prices, so its lines 2.1 and 2.2 show without prices and only the section subtotal is shown. The quote total with VAT appears at the bottom.</desc>
<style>
.lbl{font-family:Manrope,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
.title{font-size:14px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.field{fill:#F6F8FA;stroke:#CBD2DA;stroke-width:1;}
.acc{fill:#E4EFF7;stroke:#026A9F;stroke-width:1.5;}
.btn{fill:#026A9F;}
.btnt{font-size:12px;font-weight:600;fill:#FFFFFF;}
</style>
<rect x="1" y="1" width="758" height="468" rx="8" class="box"/>
<text x="24" y="30" class="lbl title">Summary of works</text>
<g class="lbl body"><text x="24" y="54">1  Ground floor</text><text x="620" y="54">422.00</text><text x="24" y="74">2  First floor</text><text x="620" y="74">524.00</text></g>
<line x1="24" y1="88" x2="736" y2="88" stroke="#E1E5EA"/>
<rect x="24" y="100" width="712" height="176" rx="4" class="acc"/>
<text x="38" y="126" class="lbl title">1  Ground floor</text>
<text x="38" y="146" class="lbl note">Fire alarm detection and sounders to the reception, offices and stores.</text>
<g class="lbl body"><text x="38" y="174">1.1  Addressable smoke detector  x 6</text><text x="620" y="174">228.00</text>
<text x="38" y="198">1.2  Manual call point  x 2</text><text x="620" y="198">84.00</text>
<text x="38" y="222">1.3  Sounder beacon  x 2</text><text x="620" y="222">110.00</text></g>
<line x1="38" y1="238" x2="722" y2="238" stroke="#CBD2DA"/>
<text x="480" y="262" class="lbl note">Section subtotal</text><text x="620" y="262" class="lbl title">422.00</text>
<rect x="24" y="292" width="712" height="130" rx="4" class="box"/>
<text x="38" y="318" class="lbl title">2  First floor</text>
<text x="38" y="338" class="lbl note">This section is set to Lines, no prices.</text>
<g class="lbl body"><text x="38" y="366">2.1  Addressable smoke detector  x 8</text>
<text x="38" y="390">2.2  Sounder beacon  x 4</text></g>
<text x="480" y="410" class="lbl note">Section subtotal</text><text x="620" y="410" class="lbl title">524.00</text>
<text x="480" y="450" class="lbl note">Total incl. VAT</text><text x="620" y="450" class="lbl title">1,135.20</text>
</svg>
